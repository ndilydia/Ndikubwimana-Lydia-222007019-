<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Nzige Parcel Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #map { height: 100vh; width: 100%; }

    #legend {
      position: absolute;
      bottom: 30px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 13px;
      min-width: 180px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    #legend h4 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }
    .legend-color {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="legend">
  <h4>Land Use</h4>
  <div class="legend-item"><div class="legend-color" style="background:#8B4513;"></div> Residential</div>
  <div class="legend-item"><div class="legend-color" style="background:#228B22;"></div> Agricultural</div>
  <div class="legend-item"><div class="legend-color" style="background:#CC0000;"></div> Commercial</div>
  <div class="legend-item"><div class="legend-color" style="background:#1E90FF;"></div> Institutional</div>
  <div class="legend-item"><div class="legend-color" style="background:#FF8C00;"></div> Industrial</div>
  <div class="legend-item"><div class="legend-color" style="background:#9400D3;"></div> Mixed Use</div>
</div>

<script>
  var map = L.map('map');

  L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    attribution: '© Google Maps',
    maxZoom: 25
  }).addTo(map);

  // ── b) Conditional color function based on Land Use ──────────────────────
  function getLandUse(parcel_num) {
    var n = parseInt(parcel_num);
    if (n <= 700)  return "Residential";
    if (n <= 1400) return "Agricultural";
    if (n <= 2100) return "Commercial";
    if (n <= 2800) return "Institutional";
    if (n <= 3500) return "Industrial";
    return "Mixed Use";
  }

  function getColor(landUse) {
    if (landUse === "Residential")   return "#8B4513";
    if (landUse === "Agricultural")  return "#228B22";
    if (landUse === "Commercial")    return "#CC0000";
    if (landUse === "Institutional") return "#1E90FF";
    if (landUse === "Industrial")    return "#FF8C00";
    if (landUse === "Mixed Use")     return "#9400D3";
    return "#888888";
  }

  function parcelStyle(feature) {
    var landUse = getLandUse(feature.properties.parcel_num);
    return {
      fillColor:   getColor(landUse),
      weight:      1,
      color:       "#333",
      fillOpacity: 0.75
    };
  }

  var selectedLayer = null;
  var geojsonLayer;

  fetch("nzigeparcels.geojson")
    .then(function(res) { return res.json(); })
    .then(function(data) {

      geojsonLayer = L.geoJSON(data, {
        style: parcelStyle,

        onEachFeature: function(feature, layer) {

          // ── c) Popup showing UPI and calculated area ─────────────────────
          var props   = feature.properties;
          var upi     = props.upi;
          var area    = parseFloat(props.Shape_Area).toFixed(2);
          var landUse = getLandUse(props.parcel_num);
          var color   = getColor(landUse);

          // Bind popup directly — opens on click automatically
          layer.bindPopup(
            "<div style='font-family:Arial;font-size:13px;min-width:200px'>" +
            "<div style='background:" + color + ";color:white;padding:6px 10px;" +
            "margin:-1px -1px 10px;border-radius:4px 4px 0 0;font-weight:bold'>" +
            "Parcel Info</div>" +
            "<b>UPI:</b> " + upi + "<br>" +
            "<b>Area:</b> " + area + " m²<br>" +
            "<b>Land Use:</b> " + landUse +
            "</div>"
          );

          layer.on("click", function() {
            if (selectedLayer) {
              geojsonLayer.resetStyle(selectedLayer);
            }
            layer.setStyle({
              weight:      3,
              color:       "#FFD700",
              fillOpacity: 0.95
            });
            selectedLayer = layer;
          });
        }
      }).addTo(map);

      map.fitBounds(geojsonLayer.getBounds());

      return fetch("nzige sector.geojson");
    })
    .then(function(res) { return res.json(); })
    .then(function(boundary) {
      L.geoJSON(boundary, {
        style: {
          fill:        false,
          weight:      3,
          color:       "red",
          dashArray:   "8 5"
        }
      }).addTo(map);
    });
</script>
</body>
</html>
